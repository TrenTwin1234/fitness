<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Силовая тренировка | Фулл-боди</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f9fafc;
            color: #1e293b;
            line-height: 1.5;
            padding: 1.5rem;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Header / Hero */
        .workout-header {
            background: linear-gradient(145deg, #4f46e5, #7c3aed);
            color: white;
            padding: 2.2rem 2rem;
            border-radius: 32px;
            margin-bottom: 2.5rem;
            box-shadow: 0 15px 30px -10px rgba(79, 70, 229, 0.3);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .workout-title h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.4rem;
        }

        .workout-title p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Прогресс и таймер */
        .stats-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            padding: 1.2rem 2rem;
            border-radius: 40px;
        }

        .progress-area {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            min-width: 180px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.95;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.25);
            border-radius: 50px;
        }

        .progress-fill {
            height: 10px;
            background: white;
            border-radius: 50px;
            width: 0%;
            transition: width 0.2s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Таймер */
        .timer-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.4rem;
        }

        .timer-display {
            font-size: 2rem;
            font-weight: 700;
            font-family: monospace;
            line-height: 1;
            background: rgba(0,0,0,0.2);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            letter-spacing: 4px;
        }

        .timer-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .timer-input {
            width: 80px;
            padding: 0.4rem 0.6rem;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            background: white;
            color: #1e293b;
            font-size: 0.95rem;
            text-align: center;
        }

        .btn {
            border: none;
            background: white;
            color: #4f46e5;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 12px rgba(0,0,0,0.04);
            border: 1px solid transparent;
        }

        .btn:hover {
            background: #f1f5f9;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.08);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid white;
            color: white;
            box-shadow: none;
        }

        .btn-outline:hover {
            background: white;
            color: #4f46e5;
            border-color: white;
        }

        /* Сетка упражнений */
        .exercises-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
            margin-bottom: 2rem;
        }

        /* Карточка упражнения */
        .exercise-card {
            background: white;
            border-radius: 28px;
            padding: 1.6rem 1.4rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            transition: all 0.25s ease;
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .exercise-card:hover {
            box-shadow: 0 20px 30px -8px rgba(79, 70, 229, 0.12);
            transform: translateY(-5px);
            border-color: #cbd5e1;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
        }

        .exercise-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
        }

        .exercise-sets {
            background: #eef2ff;
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            font-weight: 700;
            color: #4f46e5;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        .exercise-details {
            color: #475569;
            margin-bottom: 1.3rem;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .detail-icon {
            color: #4f46e5;
            width: 18px;
            text-align: center;
        }

        /* Сет подходов (чекбоксы) */
        .sets-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.2rem;
            margin-top: 0.2rem;
            margin-bottom: 0.6rem;
            pointer-events: auto;
        }

        .set-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: #f8fafc;
            padding: 0.4rem 0.9rem 0.4rem 0.7rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid #e2e8f0;
        }

        .set-item input[type="checkbox"] {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: #4f46e5;
            border-radius: 6px;
            cursor: pointer;
        }

        .exercise-card.completed {
            background: linear-gradient(145deg, #f8fafc, white);
            border-left: 8px solid #4f46e5;
        }

        .reset-btn {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 0.7rem 1.8rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .footer {
            margin-top: 2.5rem;
            display: flex;
            justify-content: center;
        }

        /* Модальное окно для деталей упражнения */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            border-radius: 36px;
            max-width: 600px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 30px 50px rgba(0,0,0,0.2);
            position: relative;
            animation: modalFadeIn 0.3s;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
        }

        .modal-close {
            font-size: 2rem;
            cursor: pointer;
            color: #64748b;
            transition: color 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            color: #0f172a;
        }

        .modal-body {
            color: #334155;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .modal-body i {
            color: #4f46e5;
            margin-right: 8px;
        }

        .exercise-tip {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 1.2rem;
            margin-top: 1.5rem;
            border-left: 5px solid #4f46e5;
        }

        /* Запрещаем всплытие клика с интерактивных элементов */
        .set-item, .set-item *, .btn, .btn *, .reset-btn, .reset-btn * {
            pointer-events: auto;
        }

        /* Адаптация */
        @media (max-width: 800px) {
            body { padding: 0.8rem; }
            .workout-header { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
            .stats-panel { width: 100%; }
            .timer-box { align-items: flex-start; width: 100%; }
            .timer-display { font-size: 1.8rem; }
        }

        @media (max-width: 500px) {
            .workout-title h1 { font-size: 1.8rem; }
            .exercises-grid { grid-template-columns: 1fr; }
            .modal-content { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка с названием и прогрессом -->
        <header class="workout-header">
            <div class="workout-title">
                <h1><i class="fas fa-dumbbell" style="margin-right: 12px;"></i> Full Body · A</h1>
                <p><i class="fas fa-bolt"></i> Базовая силовая, 6 упражнений</p>
            </div>
            <div class="stats-panel">
                <div class="progress-area">
                    <div class="progress-label">
                        <!-- ИЗМЕНЕНО: "Выполнено" -> "Время отдыха" с иконкой часов -->
                        <span><i class="fas fa-clock"></i> Время отдыха</span>
                        <span id="completed-counter">0/6</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                    </div>
                </div>
                <!-- Таймер отдыха (5 минут по умолчанию) -->
                <div class="timer-box">
                    <span class="timer-display" id="timer-display">05:00</span>
                    <div class="timer-controls">
                        <input type="number" id="timer-minutes" class="timer-input" value="5" min="0" max="10" step="1"> мин
                        <button class="btn" id="start-timer-btn"><i class="fas fa-play"></i> Старт</button>
                        <button class="btn btn-outline" id="reset-timer-btn"><i class="fas fa-stop"></i></button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Контейнер для карточек упражнений -->
        <div id="exercises-container" class="exercises-grid"></div>

        <!-- Кнопка сброса всего прогресса -->
        <div class="footer">
            <button class="reset-btn" id="reset-all-btn">
                <i class="fas fa-rotate-left"></i> Сбросить весь прогресс
            </button>
        </div>
    </div>

    <!-- Модальное окно для детального просмотра упражнения -->
    <div id="exercise-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modal-exercise-name">Румынская тяга</span>
                <span class="modal-close" id="modal-close-btn">&times;</span>
            </div>
            <div class="modal-body">
                <div id="modal-exercise-description">
                    <!-- Здесь будет описание -->
                </div>
                <div class="exercise-tip">
                    <i class="fas fa-lightbulb"></i> <strong>Совет:</strong> 
                    <span id="modal-exercise-tip">Держите спину прямой, не округляйте поясницу.</span>
                </div>
                <p style="margin-top: 1.5rem;"><i class="fas fa-video"></i> Видео-инструкция: <a href="#" id="modal-video-link" target="_blank">смотреть на YouTube</a> (пример)</p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ----- ДАННЫЕ ПРОГРАММЫ ТРЕНИРОВКИ (с описанием и ссылками) -----
            const workoutData = [
                { 
                    name: "Румынская тяга", 
                    sets: 3, 
                    reps: "10-12", 
                    weight: "вес который ты сможешь делать",
                    description: "Встаньте прямо, штанга в опущенных руках. С небольшим сгибом в коленях наклоните корпус вперёд, отводя таз назад, сохраняя спину прямой. Опускайте штангу до середины голени, затем вернитесь в исходное положение.",
                    tip: "Держите спину ровно, пресс напряжён. Не округляйте поясницу.",
                    video: "https://www.youtube.com/watch?v=7yK8SC89BNk"
                },
                { 
                    name: "Ягодичный мостик", 
                    sets: 3, 
                    reps: "15-20", 
                    weight: "вес который ты сможешь делать",
                    description: "Лягте на пол, согнув ноги, стопы на ширине плеч. Положите штангу (или блин) на таз. Упритесь пятками и поднимите таз вверх, сжимая ягодицы в верхней точке. Задержитесь на секунду и опуститесь.",
                    tip: "Не прогибайтесь в пояснице, подъём происходит за счёт ягодиц.",
                    video: "https://www.youtube.com/watch?v=1ouIr_Kf3Vc"
                },
                { 
                    name: "Выпады", 
                    sets: 3, 
                    reps: "15-24", 
                    weight: "вес который ты сможешь делать",
                    description: "Сделайте широкий шаг вперёд, опуская таз до тех пор, пока оба колена не согнутся под углом 90 градусов. Переднее колено не выходит за носок. Вернитесь в исходное положение и повторите на другую ногу.",
                    tip: "Держите корпус ровно, не наклоняйтесь вперёд.",
                    video: "https://www.youtube.com/watch?v=9hx5qJEKnPM"
                },
                { 
                    name: "Махи руками", 
                    sets: 3, 
                    reps: "10-12", 
                    weight: "вес который ты сможешь делать",
                    description: "Встаньте прямо, гантели в опущенных руках. Слегка согните локти и поднимите руки через стороны до уровня плеч. Медленно опустите обратно.",
                    tip: "Локти слегка согнуты, не используйте инерцию.",
                    video: "https://www.youtube.com/watch?v=ISL1FyQ_7bE"
                },
                { 
                    name: "Тяга верхнего блока", 
                    sets: 3, 
                    reps: "8-12", 
                    weight: "вес который ты сможешь делать",
                    description: "Сядьте на тренажёр, возьмитесь за рукоять широким хватом. Наклоните корпус чуть назад и тяните рукоять к верхней части груди, сводя лопатки. Плавно верните в исходное.",
                    tip: "Не раскачивайтесь, двигайтесь подконтрольно.",
                    video: "https://www.youtube.com/watch?v=ViA3Ws4Ezak"
                },
                { 
                    name: "Тяга горизонтального блока", 
                    sets: 3, 
                    reps: "8-12", 
                    weight: "вес который ты сможешь делать",
                    description: "Сядьте, упритесь ногами в платформу, возьмите рукоять. С прямой спиной тяните рукоять к животу, сводя лопатки. Затем медленно верните.",
                    tip: "Спина прямая, не помогайте корпусом.",
                    video: "https://www.youtube.com/watch?v=CEJ1UlrJiVQ"
                }
            ];
            // ---------------------------------------

            // Глобальные переменные
            let exercises = [];     
            let timerInterval = null;
            let timerSeconds = 300; // 5 минут по умолчанию
            let isTimerRunning = false;

            // Элементы DOM
            const exercisesContainer = document.getElementById('exercises-container');
            const completedCounterSpan = document.getElementById('completed-counter');
            const progressFill = document.getElementById('progress-fill');
            const timerDisplay = document.getElementById('timer-display');
            const timerMinutesInput = document.getElementById('timer-minutes');
            const startTimerBtn = document.getElementById('start-timer-btn');
            const resetTimerBtn = document.getElementById('reset-timer-btn');
            const resetAllBtn = document.getElementById('reset-all-btn');

            // Элементы модального окна
            const modal = document.getElementById('exercise-modal');
            const modalExerciseName = document.getElementById('modal-exercise-name');
            const modalDescription = document.getElementById('modal-exercise-description');
            const modalTip = document.getElementById('modal-exercise-tip');
            const modalVideoLink = document.getElementById('modal-video-link');
            const modalCloseBtn = document.getElementById('modal-close-btn');

            // Вспомогательные функции
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            // Обновление прогресса
            function updateProgress() {
                let completedCount = 0;
                exercises.forEach(ex => {
                    const checkboxes = ex.card.querySelectorAll('.set-checkbox');
                    const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                    if (allChecked) {
                        completedCount++;
                        ex.card.classList.add('completed');
                    } else {
                        ex.card.classList.remove('completed');
                    }
                });

                const total = exercises.length;
                const percentage = total ? (completedCount / total) * 100 : 0;
                completedCounterSpan.textContent = `${completedCount}/${total}`;
                progressFill.style.width = `${percentage}%`;
            }

            // Сброс всех чекбоксов
            function resetAllCheckboxes() {
                exercises.forEach(ex => {
                    const checkboxes = ex.card.querySelectorAll('.set-checkbox');
                    checkboxes.forEach(cb => cb.checked = false);
                });
                updateProgress();
            }

            // Таймер
            function stopTimer(resetDisplay = true) {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isTimerRunning = false;
                if (resetDisplay) {
                    const mins = parseInt(timerMinutesInput.value, 10) || 5;
                    timerSeconds = mins * 60;
                    timerDisplay.textContent = formatTime(timerSeconds);
                }
                startTimerBtn.innerHTML = '<i class="fas fa-play"></i> Старт';
                startTimerBtn.style.background = 'white';
                startTimerBtn.style.color = '#4f46e5';
            }

            function startTimer(seconds) {
                if (seconds <= 0) {
                    seconds = 300;
                    timerMinutesInput.value = 5;
                }
                stopTimer(false);
                timerSeconds = seconds;
                timerDisplay.textContent = formatTime(timerSeconds);
                isTimerRunning = true;
                startTimerBtn.innerHTML = '<i class="fas fa-pause"></i> Пауза';
                startTimerBtn.style.background = '#4f46e5';
                startTimerBtn.style.color = 'white';

                timerInterval = setInterval(() => {
                    timerSeconds--;
                    timerDisplay.textContent = formatTime(timerSeconds);

                    if (timerSeconds <= 0) {
                        stopTimer(true);
                        timerDisplay.textContent = '00:00';
                        alert('⏰ Время отдыха закончилось!');
                    }
                }, 1000);
            }

            // Функция открытия модалки с данными конкретного упражнения
            function openExerciseModal(exerciseData) {
                modalExerciseName.textContent = exerciseData.name;
                modalDescription.innerHTML = `<i class="fas fa-info-circle"></i> ${exerciseData.description}`;
                modalTip.textContent = exerciseData.tip;
                modalVideoLink.href = exerciseData.video;
                modal.style.display = 'flex';
            }

            // Закрытие модалки
            function closeModal() {
                modal.style.display = 'none';
            }

            // Генерация карточек
            function renderExercises() {
                exercisesContainer.innerHTML = '';
                exercises = [];

                workoutData.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'exercise-card';
                    card.dataset.exerciseId = index;

                    // Заголовок
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'exercise-header';
                    headerDiv.innerHTML = `
                        <span class="exercise-name">${item.name}</span>
                        <span class="exercise-sets">${item.sets} подхода</span>
                    `;

                    // Детали
                    const detailsDiv = document.createElement('div');
                    detailsDiv.className = 'exercise-details';
                    detailsDiv.innerHTML = `
                        <span><i class="fas fa-arrows-rotate detail-icon"></i> ${item.reps} повтор.</span>
                        <span><i class="fas fa-weight-hanging detail-icon"></i> ${item.weight}</span>
                    `;

                    // Блок чекбоксов
                    const setsDiv = document.createElement('div');
                    setsDiv.className = 'sets-container';
                    for (let i = 1; i <= item.sets; i++) {
                        const setItem = document.createElement('div');
                        setItem.className = 'set-item';
                        setItem.innerHTML = `
                            <input type="checkbox" class="set-checkbox" id="ex${index}-set${i}">
                            <label for="ex${index}-set${i}">Подход ${i}</label>
                        `;
                        setsDiv.appendChild(setItem);
                    }

                    card.appendChild(headerDiv);
                    card.appendChild(detailsDiv);
                    card.appendChild(setsDiv);
                    exercisesContainer.appendChild(card);

                    // Сохраняем ссылку
                    exercises.push({
                        id: index,
                        card: card,
                        data: item
                    });

                    // Слушатель чекбоксов
                    const checkboxes = card.querySelectorAll('.set-checkbox');
                    checkboxes.forEach(cb => {
                        cb.addEventListener('change', updateProgress);
                    });

                    // Клик по карточке для открытия деталей (но не по чекбоксам и кнопкам)
                    card.addEventListener('click', function(e) {
                        const target = e.target;
                        if (target.closest('.set-item') || target.closest('.btn') || target.closest('.reset-btn')) {
                            return;
                        }
                        openExerciseModal(item);
                    });
                });

                updateProgress();
            }

            // ---- ИНИЦИАЛИЗАЦИЯ ----
            renderExercises();

            // ---- ОБРАБОТЧИКИ ----

            // Сброс всего прогресса
            resetAllBtn.addEventListener('click', resetAllCheckboxes);

            // Таймер: старт/пауза
            startTimerBtn.addEventListener('click', function() {
                if (isTimerRunning) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    isTimerRunning = false;
                    startTimerBtn.innerHTML = '<i class="fas fa-play"></i> Старт';
                    startTimerBtn.style.background = 'white';
                    startTimerBtn.style.color = '#4f46e5';
                } else {
                    let mins = parseInt(timerMinutesInput.value, 10);
                    if (isNaN(mins) || mins < 0) mins = 5;
                    const seconds = mins * 60;
                    startTimer(seconds);
                }
            });

            // Сброс таймера
            resetTimerBtn.addEventListener('click', function() {
                stopTimer(true);
            });

            // Обновление дисплея при изменении поля ввода (если таймер не запущен)
            timerMinutesInput.addEventListener('input', function() {
                if (!isTimerRunning) {
                    const mins = parseInt(timerMinutesInput.value, 10) || 0;
                    timerSeconds = mins * 60;
                    timerDisplay.textContent = formatTime(timerSeconds);
                }
            });

            timerMinutesInput.addEventListener('change', function() {
                if (isTimerRunning) {
                    timerMinutesInput.value = Math.floor(timerSeconds / 60);
                } else {
                    const mins = parseInt(timerMinutesInput.value, 10) || 5;
                    timerSeconds = mins * 60;
                    timerDisplay.textContent = formatTime(timerSeconds);
                }
            });

            // Закрытие модалки
            modalCloseBtn.addEventListener('click', closeModal);
            window.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            });

            // Инициализация таймера 5 минут
            timerSeconds = 300;
            timerDisplay.textContent = formatTime(timerSeconds);
            timerMinutesInput.value = 5;
        })();
    </script>
</body>
</html>
